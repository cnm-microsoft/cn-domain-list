name: Convert Ruleset to MRS
# 触发条件：每天凌晨 4 点 (UTC) 执行，或者手动点击运行
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Prepare Directories
        run: |
          mkdir -p ./rules
          mkdir -p ./tmp_bin

      - name: Download Latest Mihomo (Compiler)
        run: |
          # 1. 获取最新版本号 (使用 jq 解析 JSON 更稳定)
          LATEST_TAG=$(curl -sSL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r .tag_name)
          echo "Latest Mihomo version: $LATEST_TAG"
          
          # 2. 下载对应架构的二进制文件
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/$LATEST_TAG/mihomo-linux-amd64-$LATEST_TAG.gz"
          wget -O ./tmp_bin/mihomo.gz "$DOWNLOAD_URL"
          
          # 3. 解压并赋予权限
          gunzip ./tmp_bin/mihomo.gz
          chmod +x ./tmp_bin/mihomo
          
          # 4. 验证版本 (这一步能确保工具下载正常)
          ./tmp_bin/mihomo -v

      - name: Download Source Rules (Upstream)
        run: |
          # 下载最新的 yaml 源文件
          echo "Downloading CN List..."
          curl -sSL -o ./rules/ext-cn-list.yaml https://raw.githubusercontent.com/xmdhs/cn-domain-list/rule-set/ext-cn-list.yaml
          
          echo "Downloading Not-CN List..."
          curl -sSL -o ./rules/ext-not-cn-list.yaml https://raw.githubusercontent.com/xmdhs/cn-domain-list/rule-set/ext-not-cn-list.yaml

      - name: Convert to MRS (Binary)
        run: |
          # 转换 CN 列表 (注意：命令必须写在同一行，不要回车)
          echo "Converting ext-cn-list..."
          ./tmp_bin/mihomo convert-ruleset domain yaml ./rules/ext-cn-list.yaml ./rules/ext-cn-list.mrs
          
          # 转换 Not-CN 列表 (注意：命令必须写在同一行，不要回车)
          echo "Converting ext-not-cn-list..."
          ./tmp_bin/mihomo convert-ruleset domain yaml ./rules/ext-not-cn-list.yaml ./rules/ext-not-cn-list.mrs
          
          # 检查生成结果
          ls -lh ./rules/*.mrs

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加所有规则文件
          git add ./rules/*.yaml
          git add ./rules/*.mrs
          
          # 仅在有变动时提交，防止报错
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update MRS ruleset: $(date +'%Y-%m-%d')"
            git push
          fi
